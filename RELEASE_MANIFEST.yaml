  sdk:
    - "ExtensionBuilder (capability construction)"
    - "ManifestValidator (MG-001~004)"
    - "SandboxAPI (mock host, scenario runner, failure injection)"
    - "ConformanceRunner (positive + negative tests)"

  interface:
    - "TPI Interface Package (8 personality API contracts)"
