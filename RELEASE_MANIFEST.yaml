# Tang OS Release Manifest
# RE-002: Every release must declare its contents.

release:
  version: "0.2.0"
  date: "2026-08-27"
  specification: "v1.0"
  type: "reference_implementation"

contents:
  core:
    - "Identity Runtime (three-layer constitution)"
    - "Invariant Engine (I-1~I-30 enforcement)"
    - "State Manager (session persistence)"

  runtime:
    - "Persona Runtime (emotional state, response policy, relationship boundary)"
    - "Memory Runtime (three-tier classification, consent gate, lifecycle)"
    - "Permission Runtime (SAP L0~L3, TAAL A0~A4, emergency protocol)"

  host:
    - "Host Simulator (manifest, adapter, sensor, actuator, isolation)"
