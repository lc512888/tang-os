name: Validation

on:
  schedule:
    - cron: "0 6 * * 1"  # 每周一
  workflow_dispatch:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install
      run: |
        pip install -e .
        pip install pytest
    - name: Full conformance suite
      run: python run_conformance.py
    - name: RIG gates
      run: python -m pytest tests/conformance/ -v --tb=short
    - name: Negative tests
      run: python -m pytest tests/conformance/test_negative.py -v --tb=short
    - name: SDK tests
      run: python -m pytest tests/sdk/ -v --tb=short
    - name: Example tests
      run: python -m pytest examples/ -v --tb=short
