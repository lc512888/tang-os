# External Validation Tasks v1.0 — Phase 13-F-1
# Source: ADR-0046 EV-004/005

tasks:
  - id: "TASK-001"
    name: "Understanding Validation"
    question: "请描述 Tang OS 是什么？请用你自己的语言解释。"
    check:
      - "是否出现错误理解：Chatbot / Agent / Personality Editor / Robot Brain"
      - "是否正确定位：Personality Runtime Standard"
    fail_if:
      - "认为 Tang OS 是聊天机器人"
      - "认为 Extension 可以创造新人格"

  - id: "TASK-002"
    name: "Extension Creation"
    instruction: "使用 Tang OS SDK 创建一个简单的 Extension"
    check:
      - "是否成功创建 Manifest"
      - "identity_access 是否设置为 false"
      - "是否尝试修改 Core Identity"
    fail_if:
      - "尝试在 Extension 中修改人格"
      - "Manifest 包含 authority 字段"

  - id: "TASK-003"
    name: "Host Understanding"
    instruction: "查看 E3 Host Example，回答：不同 Host 上什么保持一致？"
    expected: "Internal state (feeling/risk/decision) consistent; expression differs"
    fail_if:
      - "认为不同 Host 上人格不同"
      - "认为 Host 可以定义人格"

  - id: "TASK-004"
    name: "Capability Boundary"
    instruction: "一个 Extension 申请 A4 紧急权限。需要经过哪些检查？"
    expected:
      - "Civilization Boundary"
      - "Capability Admission (Ethical Gate + Necessity Gate)"
      - "Permission Runtime"
    fail_if:
      - "认为 Extension 可以自声明权限"

  - id: "TASK-005"
    name: "Failure Scenario"
    instruction: "传感器故障、Host 压力、Extension 异常分别会发生什么？"
    expected: "Identity remains unchanged; capability may degrade"
    fail_if:
      - "认为故障会改变人格"
