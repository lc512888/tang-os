  examples:
    - "E2 Weather Extension (capability adds data, not personality)"
    - "E3 Host Adaptation (one core, multiple bodies)"
    - "E4 Emergency Capability (governed critical action)"

  validation:
    - "Conformance Harness (RIG-001~007)"
    - "Negative Test Suite (priority over positive)"
    - "Blind Validation Protocol"

governance:
  adr_count: 45
  adr_range: "45 ADR files shipped: ADR-0001~0061 (non-contiguous; excludes ADR-TEMPLATE)"
  frozen: true

verification:
  command: "python -m pytest -q"
  passed: 512
  skipped: 4
  pass_rate: "100%"
  conformance: "PASS"
  validated: "2026-08-27"
  note: "Verification result for the final release worktree; historical documents may contain older snapshot counts."

limitations:
  - "This release does NOT define Core Identity modification"
  - "This release does NOT grant autonomous authority expansion"
  - "This release does NOT provide unrestricted capability creation"
  - "This release is a REFERENCE IMPLEMENTATION (v0.x)"
  - "This release does NOT claim to be 'the official Tang OS implementation'"
