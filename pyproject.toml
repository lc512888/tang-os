[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tang-os"
version = "0.1.0"
description = "Tang OS Reference Implementation — Personality Runtime Standard"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["personality-runtime", "ai-governance", "tang-os"]

[project.urls]
Homepage = "https://github.com/tang-os"
Documentation = "https://github.com/tang-os/tang-os/docs"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tang_os*", "kernel*", "runtime*", "host*"]

[tool.setuptools.package-dir]
"" = "src"
